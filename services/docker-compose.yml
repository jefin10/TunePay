# TunePay services
name: tunepay

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: tunepay_db
    environment:
      POSTGRES_DB: tunepay_db
      POSTGRES_USER: tunepay_user
      POSTGRES_PASSWORD: tunepay_password
    ports:
      - "5432:5432"
    volumes:
      - tunepay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tunepay_user -d tunepay_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tunepay_network

  # Django Backend (UPI Transaction Service)
  django:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tunepay_django
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=DJBackend.settings
      - DATABASE_URL=postgresql://tunepay_user:tunepay_password@db:5432/tunepay_db
      - POSTGRES_DB=tunepay_db
      - POSTGRES_USER=tunepay_user
      - POSTGRES_PASSWORD=tunepay_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    networks:
      - tunepay_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flask Backend (Intent Classification & Voice Assistant)
  flask:
    build:
      context: ./voice
      dockerfile: Dockerfile
    container_name: tunepay_flask
    environment:
      - FLASK_ENV=development
      - FLASK_APP=flask_server.py
      - DJANGO_BASE_URL=http://django:8000/accounts
    ports:
      - "5002:5002"
    depends_on:
      - django
    networks:
      - tunepay_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Rasa Conversational AI
  rasa:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: tunepay_rasa
    ports:
      - "5005:5005"
    volumes:
      - ./chatbot/models:/app/models
    command: run --enable-api --cors "*" --debug
    networks:
      - tunepay_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5005/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tunepay_postgres_data:
    name: tunepay_postgres_data

networks:
  tunepay_network:
    name: tunepay_network
    driver: bridge
